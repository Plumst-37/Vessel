<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140b28"/>
      <stop offset="50%" stop-color="#1e1145"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e056fd"/>
      <stop offset="100%" stop-color="#6827b0"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#neonPurple)" stroke-width="3"/>
  <rect x="9" y="9" width="110" height="110" rx="25" fill="none" stroke="url(#neonCyan)" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Gaming Gamepad / Spaceship Shield Contour -->
  <path d="M38 42 C30 42 22 48 20 62 C18 76 25 94 36 94 C42 94 48 86 54 80 L64 74 L74 80 C80 86 86 94 92 94 C103 94 110 76 108 62 C106 48 98 42 90 42 C80 42 72 48 64 54 C56 48 48 42 38 42 Z" 
        fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Central "V" Emblem (Vessel) -->
  <path d="M50 56 L64 82 L78 56" fill="none" stroke="url(#neonPurple)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M54 58 L64 77 L74 58" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- D-Pad Left -->
  <path d="M34 58 L34 72 M27 65 L41 65" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round"/>

  <!-- Action Buttons Right -->
  <circle cx="94" cy="61" r="2.8" fill="#e056fd"/>
  <circle cx="87" cy="68" r="2.8" fill="#00f2fe"/>
  <circle cx="101" cy="68" r="2.8" fill="#00f2fe"/>
  <circle cx="94" cy="75" r="2.8" fill="#e056fd"/>

  <!-- Top Accent Indicators -->
  <circle cx="64" cy="24" r="3.5" fill="#00f2fe" filter="url(#glow)"/>
  <path d="M46 26 L82 26" stroke="url(#neonPurple)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
</svg>
