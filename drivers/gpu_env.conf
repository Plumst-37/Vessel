# ==============================================================================
# VESSEL - CONFIGURACIÓN UNIVERSAL DE DRIVERS Y HARDWARE (gpu_env.conf)
# Archivo editable por el usuario. Controla la selección de pantalla,
# aceleración gráfica de GPU, hilos de CPU y capas de traducción de drivers.
# ==============================================================================

# 1. PANTALLA OBJETIVO Y GEOMETRÍA DE VIDEO
# Opciones disponibles:
#   "auto"      -> Detección automática de la pantalla activa/primaria (HDMI, DP, eDP)
#   "eDP-1"     -> Pantalla interna de laptop (ej. 1280x720, 1920x1080)
#   "HDMI-A-1"  -> Monitor externo conectado por HDMI
#   "DP-1"      -> Monitor externo conectado por DisplayPort
TARGET_MONITOR="${TARGET_MONITOR:-auto}"

# Resolución de salida de video:
#   "auto"      -> Adopta automáticamente la resolución nativa de la pantalla activa
#   "1920x1080" -> Forzar Full HD
#   "1280x720"  -> Forzar 720p HD (óptimo para GPUs de bajo consumo o portátiles)
FORCE_RESOLUTION="${FORCE_RESOLUTION:-auto}"

# 2. RENDIMIENTO Y SELECCIÓN DE GPU DEDICADA / HÍBRIDA
# Opciones para GPU_FORCE_DEDICATED:
#   "auto" -> Detecta automáticamente si el sistema posee GPU dual/híbrida y aplica
#             las mejores variables de entorno según el fabricante:
#             - NVIDIA: __NV_PRIME_RENDER_OFFLOAD=1, __GLX_VENDOR_LIBRARY_NAME=nvidia
#             - AMD: DRI_PRIME=1, AMD_VULKAN_ICD=RADV, RADV_PERFTEST=gpl,sam
#             - Intel Arc: DRI_PRIME=1, optimizaciones de pipeline ANV
#   "1"    -> Forzar GPU dedicada siempre
#   "0"    -> Desactivar offload (usar GPU integrada del procesador)
GPU_FORCE_DEDICATED="${GPU_FORCE_DEDICATED:-auto}"

# Forzar Vulkan Graphics Pipeline Library (GPL) para eliminar stuttering
# 1 = Activado (Recomendado para drivers NVIDIA 525+ y Mesa 23+)
# 0 = Desactivado
ENABLE_VULKAN_GPL="${ENABLE_VULKAN_GPL:-1}"

# Filtro explícito de dispositivo Vulkan para DXVK
# "auto"   -> Permitir enumeración automática del dispositivo óptimo
# "NVIDIA" -> Filtrar dispositivo GPU NVIDIA GeForce
# "AMD"    -> Filtrar dispositivo AMD Radeon
# "Intel"  -> Filtrar dispositivo Intel Integrada / Arc
DXVK_DEVICE_FILTER="${DXVK_DEVICE_FILTER:-auto}"

# ID PCI de dispositivo para selección forzada en capa Mesa (ej. "10de:174d")
# "auto" -> Selección automática gestionada por el kernel y drivers Mesa
MESA_DEVICE_SELECT_OVERRIDE="${MESA_DEVICE_SELECT_OVERRIDE:-auto}"

# 3. TOPOLOGÍA DE CPU Y COMPILACIÓN DE SHADERS
# "auto" -> Calcula en caliente $(nproc) para asignar el 100% de los núcleos/hilos
#           físicos y lógicos de tu procesador (Intel Core / AMD Ryzen / Xeon / Epyc)
# O especifica un número fijo (ej. 4, 8, 12, 16).
CPU_COMPILER_THREADS="${CPU_COMPILER_THREADS:-auto}"

# 4. CAPA DE TRADUCCIÓN OPENGL -> VULKAN (MESA ZINK)
# "auto"   -> Modo automático (OpenGL nativo con fallback resiliente)
# "zink"   -> Traducción oficial Mesa Zink (OpenGL sobre Vulkan). Excepcional para
#             juegos OpenGL antiguos en GPUs modernas o drivers propietarios problemáticos.
# "native" -> Forzar el driver OpenGL nativo del sistema
OPENGL_TRANSLATION="${OPENGL_TRANSLATION:-auto}"

# 5. CAPA DE TRADUCCIÓN DIRECTX PREDETERMINADA
# "dxvk"    -> DXVK (DirectX 9, 10, 11 sobre Vulkan)
# "vkd3d"   -> VKD3D-Proton (DirectX 12 sobre Vulkan)
# "wined3d" -> WineD3D (OpenGL compatibilidad para juegos retro)
DEFAULT_TRANSLATION_LAYER="${DEFAULT_TRANSLATION_LAYER:-dxvk}"

# 6. SINCRONIZACIÓN Y PRESENTACIÓN DE FOTOGRAMAS
# VSync: 1 = Activo (Fluidez sin tearing), 0 = Desactivado (Mínima latencia de entrada)
VSYNC_ENABLED="${VSYNC_ENABLED:-1}"

# Límite de FPS (0 = Sin límite / Ilimitado, 60 = Bloqueado a 60 FPS, 120 = 120 FPS)
FPS_LIMIT="${FPS_LIMIT:-60}"
