# ==============================================================================
# VESSEL - CONFIGURACIÓN CENTRAL DE DRIVERS Y HARDWARE (gpu_env.conf)
# Archivo editable por el usuario. Permite ajustar el comportamiento del motor
# de traducción gráfica, selección de pantalla y rendimiento de GPU/CPU.
# ==============================================================================

# 1. PANTALLA OBJETIVO DE SALIDA DE VIDEO
# Opciones disponibles:
#   "eDP-1"     -> Pantalla interna de laptop (ej. 1280x720 @ 60Hz)
#   "HDMI-A-1"  -> Monitor externo conectado por HDMI (ej. 1920x1080 @ 120Hz)
#   "auto"      -> Detección automática según la pantalla activa con el cursor
TARGET_MONITOR="eDP-1"

# Resolución forzada para juegos con fallos de swapchain o multimonitor
# Si se deja vacío (""), usa la resolución nativa de la pantalla seleccionada.
FORCE_RESOLUTION="1280x720"

# 2. SELECCIÓN Y RENDIMIENTO DE GPU DEDICADA
# 1 = Forzar GPU dedicada NVIDIA GeForce (PRIME Offload al 100%)
# 0 = Permitir conmutación estándar del sistema
GPU_FORCE_DEDICATED=1

# Forzar Vulkan Graphics Pipeline Library (GPL) para eliminar stuttering por completo
# 1 = Activado (Recomendado para drivers NVIDIA 525+ y Mesa 23+)
# 0 = Desactivado
ENABLE_VULKAN_GPL=1

# Filtro explícito de dispositivo Vulkan para DXVK
# "NVIDIA" = Seleccionar GPU NVIDIA GeForce
# "Intel"  = Seleccionar Intel Integrada
# "AMD"    = Seleccionar AMD Radeon
DXVK_DEVICE_FILTER="NVIDIA"

# ID PCI de dispositivo para selección en capa Mesa (10de:174d = NVIDIA MX130)
# Dejar vacío o comentar si se desea selección automática por nombre.
MESA_DEVICE_SELECT_OVERRIDE="10de:174d"

# 3. TOPOLOGÍA DE CPU Y COMPILACIÓN DE SHADERS
# Número de hilos simultáneos asignados a la compilación en segundo plano de shaders.
# 8 = 100% de los 8 hilos de CPU (Máximo rendimiento para Core i5-8250U)
CPU_COMPILER_THREADS=8

# 4. CAPA DE TRADUCCIÓN PREDETERMINADA
# "dxvk"    -> DXVK (DirectX 9, 10, 11 sobre Vulkan)
# "vkd3d"   -> VKD3D-Proton (DirectX 12 sobre Vulkan)
# "wined3d" -> WineD3D (OpenGL compatibilidad para juegos antiguos)
DEFAULT_TRANSLATION_LAYER="dxvk"

# 5. SINCRONIZACIÓN Y PRESENTACIÓN DE FOTOGRAMAS
# VSync: 1 = Activo (Fluidez sin tearing), 0 = Desactivado (Mínima latencia de entrada)
VSYNC_ENABLED=1

# Límite de FPS (0 = Sin límite, 60 = Bloqueado a 60 FPS, 120 = 120 FPS)
FPS_LIMIT=60
