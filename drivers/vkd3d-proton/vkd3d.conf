# ==============================================================================
# VESSEL - CONFIGURACIÓN MODULAR VKD3D-PROTON (DirectX 12 -> Vulkan)
# Archivo editable por el usuario para juegos DirectX 12 modernos.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. NIVEL DE CARACTERÍSTICAS Y CAPACIDADES D3D12
# ------------------------------------------------------------------------------
# Nivel máximo de Direct3D 12 soportado: 12_0, 12_1 o 12_2.
# 12_1 es ideal para NVIDIA Serie MX / GTX / RTX y AMD RDNA.
vkd3d.featureLevel = 12_1

# ------------------------------------------------------------------------------
# 2. GESTIÓN DE PIPELINES Y CACHÉ
# ------------------------------------------------------------------------------
# Habilitar caché persistente de pipelines de shaders para evitar tirones.
vkd3d.pipelineCache = 1

# ------------------------------------------------------------------------------
# 3. DEPURACIÓN Y LOGS
# ------------------------------------------------------------------------------
# Nivel de registro (none = silencioso máximo rendimiento, warn, info, trace).
vkd3d.debugLevel = none
