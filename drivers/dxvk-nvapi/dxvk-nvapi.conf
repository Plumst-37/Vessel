# ==============================================================================
# VESSEL - CONFIGURACIÓN MODULAR DXVK-NVAPI (Puente NVIDIA Reflex / DLSS)
# Archivo editable por el usuario para tarjetas gráficas NVIDIA GeForce.
# ==============================================================================

# Habilitar soporte para NVIDIA Reflex (reduce la latencia de entrada del mouse/teclado)
# 1 = Activado, 0 = Desactivado
DXVK_NVAPI_ALLOW_REFLEX=1

# Nivel de logs de DXVK-NVAPI (none, error, warn, info, debug)
# Recomendado: none para evitar saturar el disco o restar FPS.
DXVK_NVAPI_LOG_LEVEL=none
