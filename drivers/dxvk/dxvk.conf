d3d11.constantBufferRangeCheck = True
d3d11.invariantPosition = True
d3d11.floatEmulation = Strict
d3d11.relaxedBarriers = False
d3d11.relaxedGraphicsBarriers = False
d3d11.samplerAnisotropy = 8
dxvk.shrinkImageHeaps = True
dxvk.allowMemoryOvercommit = True
dxvk.zeroMappedMemory = True
dxvk.enableMemoryDefrag = True
d3d11.maxTessFactor = 16
dxvk.enableStateCache = True
dxvk.gpl = True
dxvk.enableGraphicsPipelineLibrary = True
dxvk.allowFse = False
dxvk.tearFree = False
dxgi.syncInterval = 1

