# ==============================================================================
# VESSEL - CONFIGURACIÓN MODULAR DXVK (DirectX 8/9/10/11 -> Vulkan)
# Archivo editable por el usuario: Modifica parámetros para exprimir tu hardware.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. RENDIMIENTO DE CPU Y COMPILACIÓN DE SHADERS
# ------------------------------------------------------------------------------
# Hilos simultáneos asignados para compilar pipelines de shaders en paralelo.
# "auto" detecta dinámicamente $(nproc) para usar el 100% de la CPU física/lógica.
dxvk.numCompilerThreads = auto

# Activar Vulkan Graphics Pipeline Library (GPL) para precachear pipelines
# Elimina casi al 100% los tirones (stuttering) al entrar a zonas nuevas o efectos.
dxvk.gpl = True
dxvk.enableGraphicsPipelineLibrary = True

# Habilitar caché de estados en disco para carga instantánea en ejecuciones posteriores.
dxvk.enableStateCache = True

# Modo Async alternativo (usar solo si el driver no soporta GPL).
dxvk.enableAsync = False

# ------------------------------------------------------------------------------
# 2. CONTROL DE FPS, SINCRONIZACIÓN Y PRESENTACIÓN
# ------------------------------------------------------------------------------
# Límite máximo de fotogramas por segundo (0 = ilimitado, 60 = fijar a 60 FPS).
dxgi.maxFrameRate = 60
d3d9.maxFrameRate = 60

# Intervalo de sincronización vertical (VSync): 0 = desactivado, 1 = activo.
dxgi.syncInterval = 1
d3d9.presentInterval = 1

# Presentación limpia sin desgarro de pantalla (TearFree).
dxvk.tearFree = False

# Modo de pantalla completa exclusiva (FSE): False para evitar problemas con Wayland y PRIME.
dxvk.allowFse = False

# Ocultar GPU integrada (solo activado en sistemas con GPU dedicada; False por defecto para no romper PCs con solo iGPU)
dxvk.hideIntegratedGraphics = False

# No ocultar GPU de fabricante real (evita que juegos carguen branches de shader incorrectos)
dxgi.hideNvidiaGpu = False
dxgi.hideAmdGpu = False
dxgi.hideIntelGpu = False

# Número de búferes de intercambio (2 = doble búfer baja latencia, 3 = triple búfer).
dxgi.numBackBuffers = 2
d3d9.numBackBuffers = 2

# Latencia máxima de fotogramas en cola antes de renderizar (1 o 2).
dxgi.maxFrameLatency = 1
d3d9.maxFrameLatency = 1

# ------------------------------------------------------------------------------
# 3. GESTIÓN DE MEMORIA Y TEXTURAS (VRAM Y RAM)
# ------------------------------------------------------------------------------
# Permitir sobreasignación de memoria de video (clave en GPUs con 2GB VRAM como MX130).
dxvk.allowMemoryOvercommit = True

# Reducir fragmentación de montículos de imágenes para ahorrar VRAM.
dxvk.shrinkImageHeaps = True

# Desfragmentación dinámica de memoria de video en Vulkan
dxvk.enableMemoryDefrag = True

# Inicialización a cero de memoria mapeada (evita artefactos, picos y deformación de polígonos por basura de memoria)
dxvk.zeroMappedMemory = True

# Memoria máxima de dispositivo reportada por DXGI ("auto" limita a 1800 MB en GPUs <= 2048 MB VRAM).
dxgi.maxDeviceMemory = auto

# Memoria máxima reportada para Direct3D 9 ("auto" calibra según VRAM/RAM: 1800 en <= 2GB VRAM).
d3d9.maxAvailableMemory = auto

# Tamaño máximo de bloques de memoria asignados por Vulkan ("auto" calibra según VRAM: 32, 64, 128).
dxvk.maxChunkSize = auto

# ------------------------------------------------------------------------------
# 4. PRECISIÓN GEOMÉTRICA Y CALIDAD VISUAL 3D
# ------------------------------------------------------------------------------
# Preservar posición de vértices para evitar estiramientos o deformaciones de mallas 3D y Z-fighting.
d3d9.invariantPosition = True
d3d11.invariantPosition = True

# Emulación estricta de punto flotante IEEE-754 para física y matrices de transformación 3D exactas.
d3d9.floatEmulation = Strict
d3d11.floatEmulation = Strict

# Filtrado anisotrópico forzado (4, 8 o 16 para texturas más nítidas a distancia).
d3d9.samplerAnisotropy = 8
d3d11.samplerAnisotropy = 8

# Limitar factor de teselación (d3d11.maxTessFactor) para evitar saturar el bus y deformar mallas (16 o 8).
d3d11.maxTessFactor = 16

# Verificación de rango de búferes constantes para prevenir corrupción en lectura de shaders
d3d11.constantBufferRangeCheck = True

# Barreras de memoria estrictas para prevenir condiciones de carrera entre pasadas de renderizado
d3d11.relaxedBarriers = False
d3d11.relaxedGraphicsBarriers = False

# Evitar sesgos de LOD negativos que produzcan artefactos o texturas parpadeantes
d3d9.clampNegativeLodBias = True
d3d11.clampNegativeLodBias = True

# Habilitar extensiones NVIDIA de bajo nivel (Reflex, DLSS, NVAPI, Raw Access Chains)
dxvk.enableNvapi = True
dxvk.enableNvRawAccessChains = True
dxvk.enableNvLowLatency2 = Auto

# Desactivar MSAA forzado en backend D3D11 si la GPU es de bajo VRAM
d3d11.disableMsaa = True

# ------------------------------------------------------------------------------
# 5. PERFILES ESPECÍFICOS POR JUEGO (SOBREESCRITURAS PARTICULARES)
# ------------------------------------------------------------------------------
