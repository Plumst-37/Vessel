# ==============================================================================
# DXVK CONFIGURACIÓN UNIVERSAL GENERADA AUTOMÁTICAMENTE
# CPU: Intel(R) Core(TM) i5-8250U CPU @ 1.60GHz (8 Hilos) | RAM: 11841 MB
# Gama Detectada: BAJA | Perfil: inteligente
